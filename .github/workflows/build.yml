# .github/workflows/build.yml
# Builds all three kiosk brands in parallel and uploads each as an artifact.

name: Build All Brands

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Type-check (shared, runs once) ──────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx tsc -p tsconfig.node.json --noEmit

  # ── Straunt build ────────────────────────────────────────────────────────────
  build-straunt:
    name: Build — Straunt
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build Straunt
        run: npm run build:straunt
        env:
          VITE_BRAND: straunt
          VITE_API_BASE_URL: ${{ secrets.STRAUNT_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.STRAUNT_API_KEY }}
          VITE_BRAND_HEADER: straunt
      - uses: actions/upload-artifact@v4
        with:
          name: straunt-dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ── Holiq build ──────────────────────────────────────────────────────────────
  build-holiq:
    name: Build — Holiq
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build Holiq
        run: npm run build:holiq
        env:
          VITE_BRAND: holiq
          VITE_API_BASE_URL: ${{ secrets.HOLIQ_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.HOLIQ_API_KEY }}
          VITE_BRAND_HEADER: holiq
      - uses: actions/upload-artifact@v4
        with:
          name: holiq-dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ── Restro build ─────────────────────────────────────────────────────────────
  build-restro:
    name: Build — Restro
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build Restro
        run: npm run build:restro
        env:
          VITE_BRAND: restro
          VITE_API_BASE_URL: ${{ secrets.RESTRO_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.RESTRO_API_KEY }}
          VITE_BRAND_HEADER: restro
      - uses: actions/upload-artifact@v4
        with:
          name: restro-dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  # ── Capacitor Android sync (runs only on main after all builds pass) ─────────
  cap-sync:
    name: Capacitor Android Sync
    runs-on: ubuntu-latest
    needs: [build-straunt, build-holiq, build-restro]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        brand: [straunt, holiq, restro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - run: npm ci
      - name: Download ${{ matrix.brand }} dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.brand }}-dist-${{ github.sha }}
          path: dist/
      - name: Capacitor sync — ${{ matrix.brand }}
        run: BRAND=${{ matrix.brand }} npx cap sync android
